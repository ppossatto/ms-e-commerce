spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:catalog_svc}
    password: ${DB_PASSWORD:}
  # Schema named after the role: it is in the default search_path ("$user")
  # and avoids reserved words (e.g. "order").
  flyway:
    schemas: catalog_svc
    default-schema: catalog_svc
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: catalog_svc

services:
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:8180}
  mail:
    url: ${MAILING_URL:http://localhost:1025}
  rustfs:
    url: ${RUSTFS_S3_URL:http://localhost:9000}
  valkey:
    url: ${VALKEY_CACHE_URL:http://localhost:6379}
  kafka:
    url: ${KAFKA_BROKER_URL:http://localhost:9092}
    topics:

clients:
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus