spring:
  application:
    name: template-service
  # Config shared by all services (OTLP, Keycloak issuer, Kafka...) comes from
  # infra/config/common.yaml, imported via SPRING_CONFIG_IMPORT in compose.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:template_svc}
    password: ${DB_PASSWORD:}
  # Schema named after the role: it is in the default search_path ("$user")
  # and avoids reserved words (e.g. "order").
  flyway:
    schemas: template_svc
    default-schema: template_svc
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: template_svc

clients:
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
