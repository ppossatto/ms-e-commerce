# Local development stack.
#   cp .env.example .env   (fill in the passwords)
#   docker compose up -d
#
# UIs:
#   Kafka UI  http://localhost:8085
#   RustFS    http://localhost:9001   (S3 API on :9000)
#   Mailpit   http://localhost:8025   (SMTP on :1025)
#   Keycloak  http://localhost:8180   (admin user from .env)
#   Stripe    http://localhost:12111  (stripe-mock: Stripe API, stateless)
name: ppossatto-local

services:
  postgres:
    image: postgres:18-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs only when the volume is empty: one role + schema per service.
      - ./data/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node KRaft (no ZooKeeper).
  # Services on the host use localhost:9092; containers use kafka:29092.
  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # RustFS runs as UID 10001; this one-shot service fixes the volume ownership first.
  rustfs-perms:
    image: alpine:3.24
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - rustfs-data:/data

  rustfs:
    image: rustfs/rustfs:1.0.4
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "8025:8025"
      - "1025:1025"

  # Official Stripe API mock: validates requests against Stripe's OpenAPI spec and returns
  # fixed fixtures (stateless). payment-service uses it with STRIPE_API_BASE=http://localhost:12111.
  stripe-mock:
    image: stripe/stripe-mock:v0.206.0
    ports:
      - "12111:12111"   # HTTP
      - "12112:12112"   # HTTPS

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Tokens always carry iss=http://localhost:8180/realms/<realm>, while containers
      # can still reach Keycloak internally at http://keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      # Any *.json realm export placed here is imported on startup.
      - ./security/keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
  valkey-data:
  rustfs-data: